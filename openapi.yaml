openapi: 3.0.0
info:
  title: Hirevec
  version: 1.0.0
  description: Hirevec is a job recommendation engine that matches candidates with positions.
paths:
  /candidates:
    post:
      summary: CreateCandidate
      operationId: createCandidate
      description: ''
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  scope:
                    type: string
                  user_id:
                    type: string
              example:
                access_token: v4.public.eyJhdWQiOiJoaXJldmVjLmNvbSIsImV4cCI6IjIwMjYtMTAtMDRUMTA6NDM6NThaIiwiaXNzIjoiaGlyZXZlYy5jb20iLCJwcm92aWRlciI6ImVtYWlsIiwic2NvcGUiOiJyb2xlOmNhbmRpZGF0ZSIsInN1YiI6IjAxOTljMGEzLTdjMWItN2Q1ZS05ZjJhLTNiNmM4ZDFlNGY3YSJ9
                token_type: Bearer
                expires_in: 1800
                scope: role:candidate
                user_id: 0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
                  source:
                    type: object
                    properties:
                      pointer:
                        type: string
              example:
                type: urn:hirevec:candiate-already-exists
                detail: Candidate already exists
                source:
                  pointer: user_id
      requestBody:
        $ref: '#/components/requestBodies/createcandidate'
      security:
      - bearerAuth: []
  /positions:
    post:
      summary: CreatePosition
      operationId: createPosition
      description: ''
      responses:
        '201':
          description: Created
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
              example:
                type: urn:hirevec:position-exists
                detail: Position with the same title, description and company already exists
      requestBody:
        $ref: '#/components/requestBodies/createposition'
      security:
      - bearerAuth: []
    get:
      summary: GetPositions
      operationId: getPositions
      description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    recruiter_id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    company:
                      type: string
                    is_remote:
                      type: boolean
                    location_id:
                      type: integer
                    skill_1:
                      type: string
                    skill_2:
                      type: string
                    skill_3:
                      type: string
                      nullable: true
                    skill_4:
                      type: string
                      nullable: true
                    skill_5:
                      type: string
                      nullable: true
                    is_active:
                      type: boolean
              example:
              - id: 0194bf5a-1d2e-7c3b-9a4f-5e6d7c8b9a10
                recruiter_id: 018f6b1a-2c4e-7a3b-8d5f-9e6b2a1c3d40
                title: Backend Engineer
                description: We are looking for a backend engineer to build hiring infrastructure.
                company: Example Corp
                is_remote: false
                location_id: 1
                skill_1: Go
                skill_2: PostgreSQL
                skill_3: null
                skill_4: null
                skill_5: null
                is_active: true
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
              example:
                type: urn:hirevec:missing-required-role
                detail: 'Missing required role: recruiter'
      parameters:
      - name: limit
        in: query
        description: Page limit, 32 by default, maximum page size is 128
        required: true
        schema:
          type: integer
          format: int32
        example: '32'
      security:
      - bearerAuth: []
  /reactions:
    post:
      summary: CreateReaction
      operationId: createReaction
      description: ''
      responses:
        '201':
          description: Created
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
                  source:
                    type: object
                    properties:
                      parameter:
                        type: string
              example:
                type: urn:hirevec:reaction-exists
                detail: Reaction already exists; reactions are immutable
                source:
                  parameter: id
      requestBody:
        $ref: '#/components/requestBodies/createreaction'
      security:
      - bearerAuth: []
    get:
      summary: GetReactions
      operationId: getReactions
      description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    recommendation_id:
                      type: string
                    reaction_type:
                      type: string
                    reacted_at:
                      type: string
              example:
              - recommendation_id: 0195d1e2-3f4a-7b5c-8d6e-9f0a1b2c3d40
                reaction_type: positive
                reacted_at: '2026-10-25T09:00:00Z'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
              example:
                type: urn:hirevec:missing-required-role
                detail: 'Missing one of required roles: recruiter, candidate'
      parameters:
      - name: role
        in: query
        description: role filter, can be "candidate" or "recruiter"
        required: true
        schema:
          type: string
        example: candidate
      - name: limit
        in: query
        description: page limit, 32 by default, maximum page size is 128
        required: true
        schema:
          type: integer
          format: int32
        example: '32'
      security:
      - bearerAuth: []
  /recruiters:
    post:
      summary: CreateRecruiter
      operationId: createRecruiter
      description: ''
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  scope:
                    type: string
                  user_id:
                    type: string
              example:
                access_token: v4.public.eyJhdWQiOiJoaXJldmVjLmNvbSIsImV4cCI6IjIwMjYtMTAtMDRUMTA6NDM6NThaIiwiaXNzIjoiaGlyZXZlYy5jb20iLCJwcm92aWRlciI6ImVtYWlsIiwic2NvcGUiOiJyb2xlOmNhbmRpZGF0ZSIsInN1YiI6IjAxOTljMGEzLTdjMWItN2Q1ZS05ZjJhLTNiNmM4ZDFlNGY3YSJ9
                token_type: Bearer
                expires_in: 1800
                scope: role:candidate
                user_id: 0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
                  source:
                    type: object
                    properties:
                      pointer:
                        type: string
              example:
                type: urn:hirevec:recruiter-exists
                detail: Recruiter already exists
                source:
                  pointer: user_id
      security:
      - bearerAuth: []
  /users:
    post:
      summary: CreateUser
      operationId: createUser
      description: ''
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
                  scope:
                    type: string
                  user_id:
                    type: string
              example:
                access_token: v4.public.eyJhdWQiOiJoaXJldmVjLmNvbSIsImV4cCI6IjIwMjYtMTAtMDRUMTA6NDM6NThaIiwiaXNzIjoiaGlyZXZlYy5jb20iLCJwcm92aWRlciI6ImVtYWlsIiwic2NvcGUiOiJyb2xlOmNhbmRpZGF0ZSIsInN1YiI6IjAxOTljMGEzLTdjMWItN2Q1ZS05ZjJhLTNiNmM4ZDFlNGY3YSJ9
                token_type: Bearer
                expires_in: 1800
                refresh_token: v4.local.CQUT9HnkAMKj_-c88BhsncRV9UJ5JZiItplycs5cnTBoBKRRLe0WKlXuzE9DpUHa2X
                scope: role:candidate
                user_id: 0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
                  source:
                    type: object
                    properties:
                      pointer:
                        type: string
              example:
                type: urn:hirevec:user-exists
                detail: User with the provided email already exists
                source:
                  pointer: email
      requestBody:
        $ref: '#/components/requestBodies/createuser'
  /candidates/{id}:
    delete:
      summary: DeleteCandidate
      operationId: deleteCandidate
      description: ''
      responses:
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
              example:
                type: urn:hirevec:missing-required-role
                detail: 'Missing required role: candidate'
      parameters:
      - name: id
        in: path
        description: candidate ID in UUID format or "me"
        required: true
        schema:
          type: string
        example: me
      security:
      - bearerAuth: []
    get:
      summary: GetCandidate
      operationId: getCandidate
      description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              example: "{\n  \"id\": \"0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a\",\n  \"user_id\": \"0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a\",\n  \"about\": \"Backend engineer passionate about distributed systems and databases.\",\n  \"pref_remote\": true,\n  \"pref_title_1\": \"Backend Engineer\",\n  \"pref_title_2\": \"Software Engineer\",\n  \"pref_location_1_id\": 1,\n  \"pref_location_2_id\": 2,\n  \"last_recommended_at\": \"2026-10-25T00:00:00Z\",\n  \"experiences\": [{\n    \"id\": \"0199c6d1-2f9a-7b3c-8e4d-5a6f1b2c3d40\",\n    \"candidate_id\": \"0199c0a3-7c1b-7d5e-9f2a-3b6c8d1e4f7a\",\n    \"title\": \"Backend Engineer\",\n    \"started_at\": \"2021-06-01T00:00:00Z\",\n    \"ended_at\": \"2024-01-01T00:00:00Z\",\n    \"description\": \"Built ingestion pipelines and internal tooling.\",\n    \"company\": \"Example Corp\",\n    \"experience_type\": \"work\",\n    \"skill_1\": \"Go\",\n    \"skill_2\": \"PostgreSQL\",\n  }]\n}"
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
                  source:
                    type: object
                    properties:
                      parameter:
                        type: string
              example:
                type: urn:hirevec:candidate-not-found
                detail: Candidate not found
                source:
                  parameter: id
      parameters:
      - name: id
        in: path
        description: candidate ID in UUID format or "me"
        required: true
        schema:
          type: string
        example: me
      security:
      - bearerAuth: []
    patch:
      summary: PatchCandidate
      operationId: patchCandidate
      description: ''
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  detail:
                    type: string
                  source:
                    type: object
                    properties:
                      pointer:
                        type: string
              example:
                type: urn:hirevec:invalid-candidate-about-format
                detail: About must be up to 1024 characters
                source:
                  pointer: about
      parameters:
      - name: id
        in: path
        description: candidate ID in UUID format or "me"
        required: true
        schema:
          type: string
        example: me
      requestBody:
        $ref: '#/components/requestBodies/patchcandidate'
      security:
      - bearerAuth: []
